[package]
name = "seer"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Control-and-call outlines of source code"
repository = "https://github.com/MajorScruffy/seer"

[dependencies]
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.25"
tree-sitter-java = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3"
